name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 scripts/ tests/ --count --show-source --statistics

      - name: Test with pytest
        run: pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check lessons.css is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code app/styles/lessons.css || (echo "app/styles/lessons.css is stale: run npm run build:css and commit it" && exit 1)
